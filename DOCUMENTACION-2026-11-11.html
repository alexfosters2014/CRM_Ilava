<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Facturación — Documentación interactiva</title>
<style>
  :root {
    --fondo: #f5f6f8;
    --panel: #ffffff;
    --borde: #e3e6ea;
    --texto: #1f2430;
    --texto-suave: #5c6470;
    --acento: #4f46e5;
    --acento-suave: #eef2ff;
    --verde: #15803d; --verde-bg: #ecfdf5;
    --rojo: #b91c1c; --rojo-bg: #fef2f2;
    --ambar: #b45309; --ambar-bg: #fffbeb;
    --violeta: #6d28d9; --violeta-bg: #f5f3ff;
    --azul: #1d4ed8; --azul-bg: #eff6ff;
    --cian: #0e7490; --cian-bg: #ecfeff;
    --gris: #475569; --gris-bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.55;
  }
  a { color: var(--acento); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre {
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: .88em;
  }
  code {
    background: #f0f2f5;
    padding: .1em .35em;
    border-radius: 4px;
  }
  /* ---------- Layout ---------- */
  .contenedor { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  nav {
    background: #10141f;
    color: #cbd5e1;
    padding: 1.1rem .9rem;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
  }
  nav .marca { font-weight: 700; color: #fff; font-size: 1rem; margin-bottom: .2rem; }
  nav .version { font-size: .75rem; color: #64748b; margin-bottom: 1rem; }
  nav a.nav-item {
    display: block;
    color: #cbd5e1;
    padding: .35rem .55rem;
    border-radius: 6px;
    font-size: .87rem;
    margin-bottom: .15rem;
  }
  nav a.nav-item:hover { background: #1e2536; color: #fff; text-decoration: none; }
  nav a.nav-item .num { color: #64748b; margin-right: .5rem; font-size: .78rem; }
  main { padding: 1.6rem 2.2rem 4rem; max-width: 1150px; }
  /* ---------- Cabecera ---------- */
  .cabecera { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .cabecera h1 { margin: 0; font-size: 1.5rem; }
  .cabecera .fecha { color: var(--texto-suave); font-size: .85rem; }
  .buscador { margin-left: auto; }
  .buscador input {
    padding: .5rem .8rem;
    border: 1px solid var(--borde);
    border-radius: 8px;
    width: 260px;
    font-size: .9rem;
    background: var(--panel);
  }
  /* ---------- Secciones y tarjetas ---------- */
  section.seccion { margin-bottom: 2.4rem; }
  section.seccion > h2 {
    font-size: 1.2rem;
    border-bottom: 2px solid var(--acento);
    padding-bottom: .35rem;
    margin-bottom: 1rem;
    scroll-margin-top: 1rem;
  }
  .subtitulo { color: var(--texto-suave); font-size: .9rem; margin: -.6rem 0 1rem; }
  .tarjeta {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    margin-bottom: .9rem;
  }
  .tarjeta h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .tarjeta h4 { margin: .8rem 0 .35rem; font-size: .92rem; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .03em; }
  ul.lista { margin: .3rem 0; padding-left: 1.2rem; }
  ul.lista li { margin-bottom: .28rem; }
  /* ---------- Tablas ---------- */
  table { width: 100%; border-collapse: collapse; font-size: .88rem; background: var(--panel); }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { background: #f8f9fb; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); }
  tr:last-child td { border-bottom: none; }
  .tabla-wrap { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow-x: auto; }
  .tabla-wrap table { border: none; }
  /* ---------- Badges ---------- */
  .badge {
    display: inline-block;
    font-size: .72rem;
    font-weight: 600;
    padding: .1rem .5rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .b-verde { background: var(--verde-bg); color: var(--verde); }
  .b-rojo { background: var(--rojo-bg); color: var(--rojo); }
  .b-ambar { background: var(--ambar-bg); color: var(--ambar); }
  .b-violeta { background: var(--violeta-bg); color: var(--violeta); }
  .b-azul { background: var(--azul-bg); color: var(--azul); }
  .b-cian { background: var(--cian-bg); color: var(--cian); }
  .b-gris { background: var(--gris-bg); color: var(--gris); }
  .b-acento { background: var(--acento-suave); color: var(--acento); }
  /* ---------- Cronología ---------- */
  .linea-tiempo { position: relative; padding-left: 1.6rem; }
  .linea-tiempo::before {
    content: "";
    position: absolute;
    left: .45rem; top: .4rem; bottom: .4rem;
    width: 2px;
    background: var(--borde);
  }
  .evento { position: relative; margin-bottom: 1.1rem; }
  .evento::before {
    content: "";
    position: absolute;
    left: -1.6rem; top: .35rem;
    width: .78rem; height: .78rem;
    border-radius: 50%;
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 2px var(--borde);
    background: var(--acento);
  }
  .evento .fecha { font-size: .78rem; color: var(--texto-suave); font-weight: 600; }
  .evento .titulo { font-weight: 600; }
  .evento .resumen { font-size: .9rem; color: var(--texto-suave); margin-top: .1rem; }
  .evento .engram { font-size: .75rem; color: var(--gris); margin-top: .2rem; }
  .evento .engram code { background: var(--gris-bg); }
  /* ---------- Diagramas ---------- */
  .diagrama {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: .9rem;
    overflow-x: auto;
  }
  .diagrama .nota { font-size: .78rem; color: var(--texto-suave); margin-top: .5rem; }
  /* ---------- Llamadas ---------- */
  .aviso {
    border-left: 4px solid var(--acento);
    background: var(--acento-suave);
    padding: .7rem 1rem;
    border-radius: 0 8px 8px 0;
    font-size: .9rem;
    margin-bottom: .9rem;
  }
  .ruta-rapida { counter-reset: paso; }
  .ruta-rapida li { list-style: none; margin-bottom: .4rem; counter-increment: paso; }
  .ruta-rapida li::before {
    content: counter(paso);
    display: inline-block;
    width: 1.35rem; height: 1.35rem;
    background: var(--acento);
    color: #fff;
    border-radius: 50%;
    text-align: center;
    line-height: 1.35rem;
    font-size: .78rem;
    margin-right: .55rem;
  }
  .mermaid { text-align: center; }
  /* ---------- Vitrina de componentes ---------- */
  .vitrina-card h3 { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }
  .vitrina-proposito { color: var(--texto-suave); font-size: .85rem; margin-bottom: .7rem; }
  .vitrina-tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--borde); margin-bottom: .6rem; }
  .vitrina-tab {
    padding: .35rem .8rem;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--texto-suave);
    font: inherit;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vitrina-tab.activa {
    background: var(--panel);
    border-color: var(--borde);
    color: var(--acento);
  }
  .vitrina-panel { display: none; }
  .vitrina-panel.activa { display: block; }
  .vitrina-vista {
    background: #f8f9fc;
    border: 1px dashed #dbe2f3;
    border-radius: 8px;
    padding: .9rem;
    overflow-x: auto;
  }
  .vitrina-vista .muestra { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .vitrina-vista .muestra-col { display: grid; gap: .6rem; }
  .vitrina-code {
    max-height: 26rem;
    overflow: auto;
    margin: 0;
    padding: .8rem 1rem;
    background: #f4f6fa;
    border: 1px solid var(--borde);
    border-radius: 8px;
    font-size: .72rem;
    line-height: 1.5;
    white-space: pre;
    color: #24304d;
  }
  @media (max-width: 900px) {
    .contenedor { grid-template-columns: 1fr; }
    nav { position: static; height: auto; }
    .buscador input { width: 100%; }
  }
  @media print {
    nav, .buscador { display: none; }
    .contenedor { grid-template-columns: 1fr; }
  }
</style>
</head>

    <div id="contenido"></div>

</div>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function filasTabla(cabeceras, filas) {
  let h = "<div class=\"tabla-wrap\"><table><thead><tr>";
  cabeceras.forEach(c => h += "<th>" + esc(c) + "</th>");
  h += "</tr></thead><tbody>";
  filas.forEach(f => {
    h += "<tr>";
    f.forEach(c => h += "<td>" + esc(c) + "</td>");
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}
const COLORES_TIPO = {
  feature: "b-verde", bugfix: "b-rojo", decision: "b-ambar",
  architecture: "b-violeta", pattern: "b-cian", config: "b-gris", docs: "b-azul"
};
const SECCIONES = [];
function seccion(id, titulo, sub, html) {
  SECCIONES.push({ id, titulo });
  return "<section class=\"seccion\" id=\"" + id + "\"><h2>" + esc(titulo) + "</h2>"
    + (sub ? "<div class=\"subtitulo\">" + esc(sub) + "</div>" : "") + html + "</section>";
}
function diagrama(titulo, src, nota) {
  return "<div class=\"diagrama\"><h3>" + esc(titulo) + "</h3>"
    + "<div class=\"mermaid\">" + esc(src) + "</div>"
    + (nota ? "<div class=\"nota\">" + esc(nota) + "</div>" : "") + "</div>";
}

    + protoCard("import-proto", "Importación de pendientes: previsualización con totales y tramos antes de confirmar. La referencia importa sin grilla previa.", importHtml, importCss)
    + protoCard("detalle-proto", "Modal de servicio: destinatarios, cuenta corriente, historial de envíos y clasificación. Datos ficticios.", detalleHtml, detalleCss)
    + protoCard("tracking-proto", "Seguimiento: cronología completa, registro de gestión y tickets por área/asignado. El ticket es una entidad nueva propuesta.", trackingHtml, trackingCss)
     + "<div class=\"tarjeta\"><h3>Otras pantallas propuestas</h3><div class=\"muted\" style=\"font-size:.82rem;margin-bottom:.5rem\">Funcionalidad que se desprende del contexto relevado; no reemplaza las decisiones abiertas de la sección 6A.</div>" + otras + "</div>";
   html += seccion("prototipos-cobranza", "14 · Prototipos: importación, detalle y seguimiento", "Referencias visuales HTML/CSS para revisar antes de aprobar. Sin menú de navegación: el foco es el contenido operativo.", prototipos);

  /* V15 — Revisión funcional de la pantalla Cobranza */
  const v15 = DATA.revisionV15;
  let v15Html = "<div class=\"aviso\"><strong>Estado: pendiente de aprobación funcional.</strong> Esta sección convierte la propuesta visual en un contrato de revisión. No autoriza migraciones, endpoints ni componentes todavía.</div>"
    + "<div class=\"tarjeta\"><h3>Conclusión ejecutiva</h3><p>" + esc(v15.resumen) + "</p></div>"
    + "<div class=\"tarjeta\"><h3>Alcance propuesto</h3>" + filasTabla(["Bloque", "Qué contiene", "Acción / restricción"], v15.alcance) + "</div>"
    + diagrama("Flujo operativo a validar", v15.flujo, "El envío confirmado es el punto que consolida auditoría, reactiva exclusiones temporales y actualiza la cartera.")
    + "<div class=\"tarjeta\"><h3>Reglas e invariantes</h3><ul class=\"lista\">" + v15.reglas.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>"
    + "<div class=\"tarjeta\"><h3>Inconsistencias a resolver</h3>" + filasTabla(["Tema", "Problema", "Criterio recomendado"], v15.inconsistencias) + "</div>"
    + "<div class=\"tarjeta\"><h3>Configuraciones necesarias</h3>" + filasTabla(["Área", "Configuración", "Criterio"], v15.configuracion) + "</div>"
    + "<div class=\"tarjeta\"><h3>Verificación contra el código disponible</h3>" + filasTabla(["Área", "Evidencia", "Implicancia para V15"], v15.verificacionCodigo) + "</div>"
    + "<div class=\"tarjeta\"><h3>Decisiones bloqueantes antes de código</h3><ul class=\"lista\">" + v15.decisiones.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>"
    + "<div class=\"tarjeta\"><h3>Checklist de aprobación</h3><ul class=\"lista\">" + v15.aprobacion.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  html += seccion("v15-cobranza", "V15 · Revisión funcional: pantalla Cobranza", "Cartera NORMAL, gestiones especiales, detalle de servicio, envíos, cuenta corriente y plantillas. Revisión previa a implementación.", v15Html);


  /* 15 — Vitrina de componentes */
  let vitrinaHtml;
  if (typeof VITRINA !== "undefined" && VITRINA.length) {
    vitrinaHtml = VITRINA.map((c, i) => {
      const id = "vitrina-" + i;
      return "<div class=\"tarjeta vitrina-card\">"
        + "<h3>" + esc(c.nombre)
        + " <span class=\"badge b-acento\">" + esc(c.archivo) + "</span>"
        + " <span class=\"badge b-gris\">" + c.lineas + " líneas</span></h3>"
        + "<div class=\"vitrina-proposito\">" + esc(c.proposito) + "</div>"
        + "<div class=\"vitrina-tabs\">"
        + "<button type=\"button\" class=\"vitrina-tab activa\" data-vitrina-tab=\"" + id + "-vista\">Vista</button>"
        + "<button type=\"button\" class=\"vitrina-tab\" data-vitrina-tab=\"" + id + "-html\">HTML</button>"
        + "<button type=\"button\" class=\"vitrina-tab\" data-vitrina-tab=\"" + id + "-css\">CSS</button>"
        + "</div>"
        + "<div class=\"vitrina-panel activa\" id=\"" + id + "-vista\">"
        + "<style>@scope (." + id + ") {\n" + esc(c.css) + "\n}\n@scope (." + id + ") {\n" + esc(c.vistaAjustes) + "\n}</style>"
        + "<div class=\"vitrina-vista " + id + "\">" + c.vista + "</div>"
        + "</div>"
        + "<div class=\"vitrina-panel\" id=\"" + id + "-html\"><pre class=\"vitrina-code\"><code>" + esc(c.html) + "</code></pre></div>"
        + "<div class=\"vitrina-panel\" id=\"" + id + "-css\"><pre class=\"vitrina-code\"><code>" + esc(c.css) + "</code></pre></div>"
        + "</div>";
    }).join("");
  } else {
    vitrinaHtml = "<div class=\"aviso\">Vitrina no generada. Ejecutar: <code>node scripts/generar-vitrina.js</code></div>";
  }
  html += seccion("vitrina", "15 · Vitrina de componentes", "Cómo se ve cada componente, con su HTML y CSS reales (generados desde los archivos .svelte).", vitrinaHtml);

  document.getElementById("contenido").innerHTML = html;

  /* Navegación */
  document.getElementById("nav").innerHTML = "<div class=\"marca\">CRM Facturación</div><div class=\"version\">v" + DATA.meta.version
    + " · " + DATA.meta.actualizado + "</div>"
    + SECCIONES.map((s, i) => "<a class=\"nav-item\" href=\"#" + s.id + "\"><span class=\"num\">" + (i + 1).toString().padStart(2, "0") + "</span>" + esc(s.titulo.replace(/^\d+ · /, "")) + "</a>").join("");

  /* Diagramas Mermaid: carga asíncrona con timeout para no bloquear la página */
  let fallbackUsado = false;
  const FALLBACK_MERMAID = function () {
    if (fallbackUsado) return;
    fallbackUsado = true;
    document.querySelectorAll(".mermaid").forEach(el => {
      el.innerHTML = "<pre style=\"text-align:left;white-space:pre-wrap\">" + esc(el.textContent) + "</pre>";
      el.insertAdjacentHTML("beforebegin", "<div class=\"aviso\">Diagrama sin renderizar (Mermaid no disponible). Se muestra el código fuente.</div>");
    });
  };
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    mermaid.run({ querySelector: ".mermaid" }).catch(FALLBACK_MERMAID);
  } else {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
    script.onload = function () {
      mermaid.initialize({ startOnLoad: false, theme: "neutral" });
      mermaid.run({ querySelector: ".mermaid" }).catch(FALLBACK_MERMAID);
    };
    script.onerror = FALLBACK_MERMAID;
    setTimeout(function () { if (!window.mermaid) FALLBACK_MERMAID(); }, 6000);
    document.head.appendChild(script);
  }
}

/* Pestañas de la vitrina de componentes */
document.getElementById("contenido").addEventListener("click", function (e) {
  const boton = e.target.closest(".vitrina-tab");
  if (!boton) return;
  const card = boton.closest(".vitrina-card");
  card.querySelectorAll(".vitrina-tab").forEach(function (b) { b.classList.toggle("activa", b === boton); });
  card.querySelectorAll(".vitrina-panel").forEach(function (p) { p.classList.toggle("activa", p.id === boton.dataset.vitrinaTab); });
});

/* Búsqueda: filtra tarjetas, filas de tabla e ítems de lista */
document.getElementById("buscar").addEventListener("input", function (e) {
  const q = e.target.value.trim().toLowerCase();
  const tarjetas = document.querySelectorAll(".tarjeta, .diagrama, .tabla-wrap, .evento, .aviso, .subtitulo");
  tarjetas.forEach(t => {
    const ok = !q || t.textContent.toLowerCase().includes(q);
    t.style.display = ok ? "" : "none";
  });
  document.querySelectorAll("ul.lista li").forEach(li => {
    const ok = !q || li.textContent.toLowerCase().includes(q);
    li.style.display = ok ? "" : "none";
  });
  document.querySelectorAll("section.seccion").forEach(sec => {
    const visible = !q || sec.textContent.toLowerCase().includes(q);
    sec.style.display = visible ? "" : "none";
  });
});

render();
</script>
</body>
</html>
