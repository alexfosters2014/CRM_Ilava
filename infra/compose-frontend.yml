# Frontend (cliente) en su propio contenedor, proyecto de compose propio sobre
# la red externa compartida con el backend.
#
# Requisito previo (lo hace scripts/levantar.ps1):
#   docker network create crm-net
#
# Uso (el backend tiene que estar arriba para que `backend` resuelva):
#   docker compose -f compose-frontend.yml up -d --build
name: crm-frontend

services:
  frontend:
    build:
      context: ../cliente
      # `production` compila y sirve con adapter-node; el overlay .dev.yml
      # cambia el target a `dev` (Vite con HMR).
      target: production
    image: crm-frontend
    container_name: crm-frontend
    environment:
      # Por la red compartida, la API se resuelve por nombre de servicio.
      # `host.containers.internal` es de Podman y Docker no lo resuelve.
      API_URL: http://backend:3000
      PORT: "4173"
      HOST: "0.0.0.0"
    networks:
      - crm-net
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  crm-net:
    external: true
