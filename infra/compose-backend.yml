# Backend: Web API + PostgreSQL + Chromium en UN contenedor (imagen
# servidor/Dockerfile.db). Es la misma arquitectura que veniamos usando: dentro
# del contenedor la API habla con PostgreSQL por localhost.
#
# Proyecto propio (`crm-backend`) para que no comparta ciclo de vida con el
# frontend, sobre una red externa compartida.
#
# Requisito previo (lo hace scripts/levantar.ps1):
#   docker network create crm-net
#
# Uso:
#   docker compose --env-file ../servidor/.env -f compose-backend.yml up -d --build
#
# Requisito: BETTER_AUTH_SECRET definido en el entorno o en el --env-file.
name: crm-backend

services:
  backend:
    build:
      context: ../servidor
      dockerfile: Dockerfile.db
      # `production` es la etapa con el artefacto compilado. Para desarrollo,
      # infra/compose-backend.dev.yml cambia el target a `dev`.
      target: production
    image: crm-backend
    container_name: crm-backend
    # Credenciales SMTP, Gmail, CORREO_CLAVE y BETTER_AUTH_SECRET del host.
    # servidor/.env esta en .dockerignore: no viaja dentro de la imagen.
    env_file:
      - ../servidor/.env
    environment:
      # --- PostgreSQL interno (mismo contenedor) ---
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crmdb}
      # La API se conecta por localhost: misma maquina. Si cambias
      # POSTGRES_PASSWORD, usa una clave segura para URL o define DATABASE_URL
      # explicitamente.
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@localhost:5432/${POSTGRES_DB:-crmdb}

      # --- API ---
      PORT: "3000"
      HOST: "0.0.0.0"
      CHROME_PATH: /usr/bin/chromium
      # adapter-node lee estas cabeceras del proxy del frontend para
      # reconstruir el origin publico (sin ellas Better Auth rechaza el Origin).
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

      # --- Better Auth (obligatorio, sin default publico) ---
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en el entorno o en el --env-file}
      # URL publica del FRONTEND tal como la ve el navegador. OJO: no se
      # interpola desde servidor/.env porque ese archivo tiene los valores del
      # modo host (5173) y pisarian los del contenedor. En produccion se define
      # PUBLIC_ORIGIN / PUBLIC_ORIGIN_TRUSTED en el entorno.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://127.0.0.1:4173}
      # Origenes del frontend confiables para Better Auth (CSRF).
      TRUSTED_ORIGINS: ${PUBLIC_ORIGIN_TRUSTED:-http://localhost:4173,http://127.0.0.1:4173}

      # --- WhatsApp (Baileys) ---
      WHATSAPP_AUTH_DIR: /app/.whatsapp-auth
    volumes:
      # Datos de PostgreSQL: sobreviven a recrear el contenedor.
      - crm-pgdata:/var/lib/postgresql/data
      # Credenciales de la sesion de WhatsApp: equivalen a la cuenta.
      - crm-wa-auth:/app/.whatsapp-auth
    networks:
      - crm-net
    ports:
      - "8080:3000"   # API + OpenAPI
      - "5433:5432"   # PostgreSQL, solo para inspeccion desde el anfitrion
    healthcheck:
      # Se usa 127.0.0.1 y no localhost: dentro del contenedor localhost
      # resuelve primero a ::1 y la API escucha en IPv4.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/salud || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  # La crea scripts/levantar.ps1 (o `docker network create crm-net`).
  crm-net:
    external: true

volumes:
  # Nombres fijos: no dependen del nombre del proyecto de compose.
  crm-pgdata:
    name: crm-pgdata
  crm-wa-auth:
    name: crm-wa-auth
